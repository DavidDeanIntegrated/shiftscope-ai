# Builds the site and publishes dist/ to the gh-pages branch.
# GitHub Pages setting: Settings → Pages → Build and deployment → Source: "Deploy from a branch" → Branch: gh-pages, folder: / (root).
# Live URL: https://daviddeanintegrated.github.io/shiftscope-ai/
# For a custom domain later, change BASE to / and SITE_URL to the domain.
name: Build and publish to gh-pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BASE: /shiftscope-ai/
      SITE_URL: https://daviddeanintegrated.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node build.mjs
      - run: node scripts/check-links.mjs
      - name: Push dist/ to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
